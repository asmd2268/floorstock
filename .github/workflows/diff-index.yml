"name":"Diff Index","on":"workflow_dispatch","jobs":{"diff":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"diff","run":"python3 -c \"public_html=open('public/index.html',encoding='utf-8').read(); root_html=open('index.html',encoding='utf-8').read(); expected=public_html.replace('./assets/','./public/assets/'); a=root_html; b=expected; i=next((k for k in range(min(len(a),len(b))) if a[k]!=b[k]), None); print('DIFF_INDEX',i,'LEN_A',len(a),'LEN_B',len(b)); print('ROOT_CTX::' + (a[max(0,(i or 0)-150):(i or 0)+150] if i is not None else 'NONE')); print('EXPECTED_CTX::' + (b[max(0,(i or 0)-150):(i or 0)+150] if i is not None else 'NONE'))\""}]}}}
