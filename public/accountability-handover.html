<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Accountability Handover</title>
  <style>
    :root{--bg:#f5f7fb;--bg2:#fff;--bg3:#eef2f7;--bd:#d7dde7;--tx:#152033;--tx2:#5d6879;--primary:#175cd3}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--bg);color:var(--tx);padding:20px;font-family:Arial,Tahoma,sans-serif}.handover-shell{max-width:760px;margin:0 auto}.handover-card{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.08)}.handover-title{font-size:24px;font-weight:800;margin-bottom:4px}.handover-sub{color:var(--tx2);white-space:pre-line}.handover-status{margin:16px 0;padding:12px;border-radius:12px;background:var(--bg3);white-space:pre-line}.handover-table{width:100%;border-collapse:collapse;margin:14px 0}.handover-table th,.handover-table td{border-bottom:1px solid var(--bd);padding:10px;text-align:start}.handover-form{display:grid;gap:12px;margin-top:16px}.handover-form input{width:100%;box-sizing:border-box}.handover-form input{padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px}.handover-form button{min-height:48px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:16px;cursor:pointer}.handover-form button:disabled{opacity:.6;cursor:wait}.handover-hidden{display:none!important}.handover-error{background:#fee2e2;color:#991b1b}.handover-success{background:#dcfce7;color:#166534}.handover-warning{background:#fef3c7;color:#92400e}.lang-line{display:block}.lang-line[dir="rtl"]{text-align:right}.lang-line[dir="ltr"]{text-align:left}
  </style>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-check-compat.js"></script>
  <script src="./assets/js/accountability-handover-public.js?v=R6.75.1" defer></script>
</head>
<body>
  <main class="handover-shell">
    <section class="handover-card">
      <div class="handover-title">Medication Accountability Handover</div>
      <div class="handover-sub"><span class="lang-line" dir="rtl">تأكيد الاستلام والتسليم</span><span class="lang-line" dir="ltr">Temporary two-party confirmation link</span></div>
      <div id="handover-status" class="handover-status">Loading handover details…
جاري تحميل تفاصيل العملية…</div>
      <div id="handover-details" class="handover-hidden">
        <div><b id="handover-party"></b></div>
        <div id="handover-department" class="fhint"></div>
        <table class="handover-table">
          <thead><tr><th>Medicine / العلاج</th><th>Units / الوحدات</th></tr></thead>
          <tbody id="handover-items"></tbody>
        </table>
        <div id="handover-expiry" class="fhint"></div>
        <form id="handover-form" class="handover-form">
          <label><span class="lang-line" dir="rtl">اسم الموظف *</span><span class="lang-line" dir="ltr">Employee name *</span><input id="handover-name" maxlength="120" autocomplete="name" required></label>
          <label><span class="lang-line" dir="rtl">الرقم الوظيفي *</span><span class="lang-line" dir="ltr">Employee number *</span><input id="handover-employee" maxlength="60" autocomplete="off" required></label>
          <button id="handover-submit" class="btn bp" type="submit">Confirm / تأكيد</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
